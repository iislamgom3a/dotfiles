set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -g xterm-keys on

# General
set -g set-clipboard on
set -g detach-on-destroy off     # Don't exit from tmux when closing a session
set -g escape-time 0             # Zero-out escape time delay
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3         # Update status every 3 seconds
set -g allow-passthrough on
set -g status-position top
set -g cursor-style block 

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on       # Renumber windows when one is closed

# Key bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

unbind %
bind \\ split-window -h -l 70 -c "#{pane_current_path}"

unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

unbind n
bind n command-prompt -p "New Session:" "new-session -A -s '%%'"
unbind C-n
bind C-n command-prompt -p "Rename Session:" "rename-session '%%'"

# Vim-style pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z     # Maximize pane


# Enable vi mode
set-window-option -g mode-keys vi

bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi 'v' send-keys -X begin-selection

# Paste with Prefix + P
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane
set -as terminal-features ",*:hyperlinks"

set -g mode-style "fg=#e6edf3,bg=#21262d"
set -g message-style "fg=#e6edf3,bg=#21262d"
set -g message-command-style "fg=#e6edf3,bg=#21262d"
set -g pane-border-style "fg=#21262d"
set -g pane-active-border-style "fg=#2f81f7"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#e6edf3,bg=#161b22"
set -g status-left-length "100"
set -g status-right-length "200"
set -g status-left-style NONE
set -g status-right-style NONE

# Rounded session pill
set -g status-left "#[fg=#2f81f7,bg=#161b22]#[fg=#e6edf3,bg=#2f81f7,bold] #S #[fg=#2f81f7,bg=#161b22]"

# Rounded segments on the right: prefix, cpu/mem, clock, host
set -g status-right "#{?client_prefix,#[fg=#f0883e#,bg=#161b22] PREFIX ,}#[fg=#21262d,bg=#161b22]#[fg=#8b949e,bg=#21262d]  #{cpu}   #{mem} #[fg=#21262d,bg=#161b22]  #[fg=#21262d,bg=#161b22]#[fg=#e6edf3,bg=#21262d] %Y-%m-%d  %I:%M %p #[fg=#21262d,bg=#161b22]  #[fg=#1f6feb,bg=#161b22]#[fg=#e6edf3,bg=#1f6feb,bold] #h #[fg=#1f6feb,bg=#161b22]"

setw -g window-status-activity-style "underscore,fg=#f0883e,bg=#161b22"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#8b949e,bg=#161b22"
setw -g window-status-format "#[fg=#8b949e,bg=#161b22] #I  #W #F "
setw -g window-status-current-format "#[fg=#3fb950,bg=#161b22]#[fg=#0d1117,bg=#3fb950,bold] #I  #W #F #[fg=#3fb950,bg=#161b22] "

# cpu/mem placeholders are filled in by tmux-cpu-mem-monitor
run '~/.tmux/plugins/tmux-cpu-mem-monitor/tmux_cpu_mem_monitor.tmux'

#plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'


set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '~/.tmux/plugins/tpm/tpm'
