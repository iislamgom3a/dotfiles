set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -g xterm-keys on

# General
set -g set-clipboard on
set -g detach-on-destroy off     # Don't exit from tmux when closing a session
set -g escape-time 0             # Zero-out escape time delay
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3         # Update status every 3 seconds
set -g allow-passthrough on
set -g status-position top
set -g cursor-style block 

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on       # Renumber windows when one is closed

# Key bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

unbind %
bind \\ split-window -h -l 70 -c "#{pane_current_path}"

unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

unbind n
bind n command-prompt -p "New Session:" "new-session -A -s '%%'"
unbind C-n
bind C-n command-prompt -p "Rename Session:" "rename-session '%%'"

# Vim-style pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z     # Maximize pane


# Enable vi mode
set-window-option -g mode-keys vi

bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi 'v' send-keys -X begin-selection

# Paste with Prefix + P
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane
set -as terminal-features ",*:hyperlinks"

# ─── GitHub Dark (Primer) palette ─────────────────────────────
#   canvas.default  #0d1117      fg.default  #e6edf3
#   canvas.subtle   #161b22      fg.muted    #8b949e
#   canvas.overlay  #21262d      fg.subtle   #6e7681
#   border.default  #30363d      accent      #2f81f7
#   attention #d29922   success #3fb950   danger #f85149
#   (light: bg #ffffff · text #1f2328 · muted #656d76 · line #d0d7de · accent #0969da)
# ──────────────────────────────────────────────────────────────

set -g mode-style "fg=#e6edf3,bg=#161b22"
set -g message-style "fg=#e6edf3,bg=#161b22"
set -g message-command-style "fg=#e6edf3,bg=#161b22"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#2f81f7"

# Flat, chrome-free status bar
# A spacer row (set -g status 2 + status-format[1] "") is possible, but tmux
# pads in whole rows only, so it costs a full line — too tall for this look.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "fg=#8b949e,bg=#0d1117"
set -g status-left-style "NONE,fg=#8b949e,bg=#0d1117"
set -g status-right-style "NONE,fg=#8b949e,bg=#0d1117"
set -g status-left-length 50
set -g status-right-length 100

# Left: session name, no pill
set -g status-left "#[fg=#e6edf3,bold] #S #[fg=#30363d,nobold]│#[fg=#0d1117] "

# Right: prefix flash · host · clock, all muted with hairline dividers
set -g status-right "#{?client_prefix,#[fg=#d29922]● prefix #[fg=#30363d]│ ,}#[fg=#6e7681]#h #[fg=#30363d]│ #[fg=#8b949e]%H:%M #[fg=#0d1117]"

# Windows: dim number + title, current one in accent
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#6e7681,bg=#0d1117"
setw -g window-status-current-style "NONE,fg=#2f81f7,bg=#0d1117,bold"
setw -g window-status-activity-style "NONE,fg=#d29922,bg=#0d1117"
setw -g window-status-bell-style "NONE,fg=#f85149,bg=#0d1117"
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "


#plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'


set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '~/.tmux/plugins/tpm/tpm'
